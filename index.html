<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AR 安装说明书</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#000}
#info{position:absolute;top:10px;left:10px;color:#fff;background:#0006;padding:8px;border-radius:6px;z-index:10}
#ctrl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:none}
button{height:44px;font-size:18px;margin:0 6px;padding:0 12px}
</style>
</head>
<body>
<div id="info">① 点击屏幕设置原点</div>
<div id="ctrl">
  <button id="prev">← 上一步</button>
  <span id="stageText" style="color:#fff;margin:0 10px">阶段 1 / 3</span>
  <button id="next">下一步 →</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* ========== 0. 全局变量 ========== */
let camera, scene, renderer;
let reticle=[], clickCount=0, stage=0;
let models=[], arrows=[];
const origin=new THREE.Vector3();
const xAxis=new THREE.Vector3();
const zAxis=new THREE.Vector3();

/* ========== 1. Three.js 初始化 ========== */
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,100);
  camera.position.set(0,1.6,0);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);
  const light=new THREE.HemisphereLight(0xffffff,0x444444,1);
  scene.add(light);
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

/* ========== 2. WebXR 启动 ========== */
async function startXR(){
  const session=await navigator.xr.requestSession('immersive-ar',{
    requiredFeatures:['hit-test','dom-overlay'],
    domOverlay:{root:document.body}
  });
  await renderer.xr.setSession(session);
  session.requestReferenceSpace('local').then(refSpace=>{
    session.requestHitTestSource({space:refSpace}).then(src=>{hitTestSource=src;});
  });
  renderer.setAnimationLoop(render);
}

/* ========== 3. 加载模型 & 箭头 ========== */
const loader=new THREE.GLTFLoader();
const names=['step1.glb','step2.glb','step3.glb']; // 同目录即可
let loaded=0;
names.forEach((url,i)=>{
  loader.load(url,gltf=>{
    models[i]=gltf.scene;
    models[i].visible=false;
    scene.add(models[i]);
    // 简单箭头
    const arrow=new THREE.Group();
    const mat=new THREE.MeshNormalMaterial();
    arrow.add(new THREE.Mesh(new THREE.ConeGeometry(0.05,0.2,8),mat));
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.3,8),mat);
    cyl.position.y=-0.25; arrow.add(cyl); arrow.scale.set(2,2,2); arrow.visible=false;
    arrows[i]=arrow; scene.add(arrow);
    if(++loaded===3) readyToPlace();
  },undefined,err=>alert('模型加载失败：'+url+' '+err));
});

/* ========== 4. 用户点 3 次 → 建立坐标系 ========== */
let hitTestSource;
function readyToPlace(){
  const info=document.getElementById('info');
  renderer.domElement.addEventListener('click',async e=>{
    if(clickCount>=3||!hitTestSource)return;
    const session=renderer.xr.getSession();
    const refSpace=await session.requestReferenceSpace('viewer');
    const hit=await session.requestHitTest(e.clientX,e.clientY,refSpace);
    if(hit.length){
      const p=hit[0].getPose(await session.requestReferenceSpace('local')).transform.position;
      reticle.push(new THREE.Vector3(p.x,p.y,p.z));
      clickCount++;
      if(clickCount===1){origin.copy(reticle[0]);info.innerText='② 在距离原点约 1 米处点击';}
      else if(clickCount===2){xAxis.subVectors(reticle[1],origin).normalize();info.innerText='③ 在水平面另一点点击';}
      else if(clickCount===3){const tmp=new THREE.Vector3().subVectors(reticle[2],origin).normalize();zAxis.crossVectors(xAxis,tmp).normalize();showUI();}
    }
  });
}

/* ========== 5. 显示 UI & 切换阶段 ========== */
function showUI(){
  document.getElementById('info').style.display='none';
  document.getElementById('ctrl').style.display='flex';
  setStage(0);
}
function setStage(n){
  models.forEach((m,i)=>m.visible=i===n);
  arrows.forEach((a,i)=>a.visible=i===n);
  if(models[n]){
    const box=new THREE.Box3().setFromObject(models[n]);
    const center=box.getCenter(new THREE.Vector3());
    arrows[n].position.copy(origin).add(center).add(new THREE.Vector3(0,box.max.y+0.3,0));
  }
  stage=n;
  document.getElementById('stageText').textContent=`阶段 ${stage+1} / 3`;
}
document.getElementById('prev').onclick=()=>setStage((stage+2)%3);
document.getElementById('next').onclick=()=>setStage((stage+1)%3);

/* ========== 6. 渲染循环 ========== */
function render(){
  renderer.render(scene,camera);
}

/* ========== 7. 启动 ========== */
init();
startXR();
</script>
</body>
</html>
